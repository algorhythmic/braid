version: 1
store: {backend: sqlite, path: ./saga.braid.db}
embed: {provider: none}
index:
  nodes:
    task: [title]
    report: [summary, failure]
    file: [path]
  cost_field: tokens
projection:
  - on: task.created
    nodes: [{type: task, id: 'task:{{.id}}', text: [title]}]
  - on: file.observed
    nodes: [{type: file, id: 'file:{{.path}}', text: [path]}]
  - on: worker.reported
    nodes: [{type: report, id: 'report:{{.id}}', text: [summary, failure]}]
    edges:
      - {from: 'report:{{.id}}', to: 'task:{{.task}}', type: for, weight: 1}
      - {from: 'report:{{.id}}', to: 'file:{{.}}', type: touched, weight: 0.9, each: files}
graph:
  damping: 0.85
  seed: uniform
  max_hops: 3
temporal: {half_life_hours: 72}
defaults:
  weights: {lexical: 1.2, dense: 0.8, graph: 1, temporal: 0.5}
  k: {lexical: 60, dense: 60, graph: 60, temporal: 60}
  boosts: [{type: report, where: 'attrs.status == failed', factor: 1.3}]
  mmr_lambda: 0.7
  budget: {max: 2500}
